name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      nix:    ${{ steps.filter.outputs.nix }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              # A workflow edit must exercise the jobs it changes; otherwise
              # editing CI is the one change CI never validates.
              - '.github/workflows/**'
            nix:
              - '**.nix'
              - 'flake.lock'
              # The nix job builds the package and renders the examples, so a
              # Python or example change can break it. Without these it only
              # runs when a .nix file changes and silently skips the renderer.
              - 'src/**'
              - 'examples/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'

  lint:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    uses: ./.github/workflows/lint.yml
    secrets: inherit

  typecheck:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    uses: ./.github/workflows/typecheck.yml
    secrets: inherit

  test-unit:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    uses: ./.github/workflows/test-unit.yml
    secrets: inherit

  test-integration:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    uses: ./.github/workflows/test-integration.yml
    secrets: inherit

  nix:
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    uses: ./.github/workflows/nix.yml
    secrets: inherit

  audit:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    uses: ./.github/workflows/audit.yml
    secrets: inherit

  # Aggregate gate: the one check the `main` ruleset requires.
  #
  # Every job above is path-filtered, so on a change that does not touch their
  # filter they are skipped — and a required check that never reports sits at
  # "Expected" and blocks the merge forever. This job always runs and turns
  # "every applicable job passed" into a single, stable status context.
  # `skipped` counts as a pass because it is the intentional path-filter result;
  # `failure`, `cancelled` and anything else fail the gate.
  ci-success:
    needs:
      - changes
      - lint
      - typecheck
      - test-unit
      - test-integration
      - nix
      - audit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          bad=$(jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"
          ' <<<"$RESULTS")
          if [ -n "$bad" ]; then
            echo "Required job(s) did not pass:"
            echo "$bad"
            exit 1
          fi
          echo "All jobs passed or were skipped."
